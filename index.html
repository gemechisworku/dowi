<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta
      name="description"
      content="Dowi — a local-first personal assistant for money, notes and tasks."
    />
    <title>Dowi</title>
    <script>
      // Applied before first paint so an explicit light/dark choice never
      // flashes the system-preference theme first. Kept in sync with the
      // storage key used by ThemeProvider (src/app/theme/ThemeProvider.tsx).
      ;(function () {
        try {
          var pref = localStorage.getItem('dowi:theme')
          if (pref === 'light' || pref === 'dark') {
            document.documentElement.setAttribute('data-theme', pref)
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
